<title>لقطات محطة الصدى</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@700&family=IBM+Plex+Sans+Arabic:wght@300;400&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
/* Layout: a mood-frame gallery, one 16:9 frame per row with its caption beside it. Single deliberate dark world. */
:root{--marsh:#070a09;--silt:#0f1412;--line:#1f2724;--reed:#97a293;--fog:#e2e8df;--mute:#5f6b64;--pulse:#6fd6a0;--tea:#c2451c;
  --display:"Reem Kufi","IBM Plex Sans Arabic",system-ui,sans-serif;--body:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--marsh)}
body{background:var(--marsh);color:var(--reed);font:300 16px/1.8 var(--body);overflow-x:hidden}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{padding-block:56px 32px;border-bottom:1px solid var(--line)}
h1,h2{font-family:var(--display);color:var(--fog);margin:0;font-weight:700}
h1{font-size:clamp(36px,6vw,64px)}
header p{max-width:42em;margin-top:12px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.28em;color:var(--pulse);display:block;direction:ltr;text-align:right;margin-bottom:8px}
.frames{display:grid;gap:44px;padding-block:44px 64px}
figure{margin:0;display:grid;grid-template-columns:minmax(0,3fr) minmax(0,1.1fr);gap:24px;align-items:start}
canvas{width:100%;height:auto;aspect-ratio:16/9;display:block;background:#000;border:1px solid var(--line)}
figcaption{display:grid;gap:8px;min-width:0}
figcaption h2{font-size:24px}
.t{font-family:var(--mono);font-size:12px;color:var(--pulse);direction:ltr;text-align:right}
figcaption .note{font-size:14px;color:var(--mute)}
@media (max-width:820px){figure{grid-template-columns:1fr}}
footer{padding-block:24px 40px;font-size:13px;color:var(--mute);border-top:1px solid var(--line)}
</style>

<header class="wrap">
  <span class="eyebrow">Echo Station · Mood Frames</span>
  <h1>لقطات الديمو المبدئية</h1>
  <p>سبع لقطات بمنظور علي، ترسم الجو والألوان وتكوين كل مشهد مهم. هاي رسومات بالكود حتى نثبّت الإحساس، مو رسم نهائي. والفنان يبني عليها.</p>
</header>

<main class="wrap frames" id="frames"></main>
<footer class="wrap">محطة الصدى · لقطات مبدئية للديمو · مسودة داخلية</footer>

<script>
const FR=[
 {id:"wake",n:0,t:"00:00 – 03:00",title:"الصحوة",cap:"أول شي باللعبة. علي يفتح عيونه وهو واگع على كونكريت مبلول، وخده على الأرض. گلوب واحد يرمش فوگ، وباب حديد نص مفتوح يطلع منه ضوء نيون. على الأرض، يم إيده، ساعته واقفة على 4:52، ومسجّل صغير بعده يلف.",note:"اللاعب ما يعرف وين هو ولا ليش. والصورة مايلة لأن الراس على الأرض."},
 {id:"bridge",n:1,t:"00:00 – 02:30",title:"الجسر العايم",cap:"الجسر المضروب من 1991 واگع بالنهر، والسيارة تعبر على جسر عايم جنبه. بالماي، انعكاس الجسر سليم، وعليه سيارة بضوايها تمشي بلا صوت.",note:"الألوان: أسود مزرق، وضباب حليبي، وضوء أصفر خافت."},
 {id:"car",n:2,t:"02:30 – 05:30",title:"وحده بالسيارة",cap:"خلف راح يجيب بنزين. قدّام السيارة، سيارة عاطلة إشاراتها ترمش ثلاث ثلاث، ولافتة أم الشويچ مكتوب جنبها \"مكتوم\". وبرمشة وحدة، شي أسود أطول من العمود.",note:"الضوء البرتقالي الوحيد هو الإشارات. وعلى الطبلون ضو المسجّل الأحمر."},
 {id:"levee",n:3,t:"05:30 – 07:15",title:"درب الساتر",cap:"قناة ناشفة مفطّرة، وحزم قصب واگفة مثل ناس ظهرهم إلك. نبضة الصدى ترسمها بخطوط خضرة، وواحد منهم يميّل راسه يمين.",note:"أول مرة يشوف اللاعب النبضة. الأخضر هو لون الصوت."},
 {id:"corridor",n:4,t:"10:00 – 22:00",title:"الممر",cap:"ممر واحد يحفظه اللاعب. نيون يرمش، ومصطبة عليها مسجّل الشريط الحي واستكان چاي أحمر، وساعة على 5:47، وباب B بالآخر. والعتمة بآخر الممر تقرب متر بكل دورة.",note:"الأحمر الوحيد المشبّع باللعبة كلها: الچاي."},
 {id:"salwa",n:5,t:"≈ 19:30",title:"الشذوذ 13",cap:"الماي ينبع من شگوگ الأرض. بزجاج باب غرفة السيطرة، انعكاس امرأة طويلة ورا علي، شعرها مبلول يغطي وجهها. يلتفت: ماكو أحد. النبضة ما ترجّع شي.",note:"الضربة العالية الأولى. الهلوسة ما تتحرك قدّام العين أبداً."},
 {id:"grate",n:6,t:"22:00 – 24:45",title:"تحت المشبّك",cap:"علي ممدود بالماي البارد تحت ممشى حديد، حابس نفسه. القاتل واگف فوگ وجهه بالضبط، بفانوس ويشماغ، والماي يقطر من جزمته على عين علي.",note:"الإطار أخضر طيني وضبابي، والصوت مكتوم."},
 {id:"knock",n:7,t:"27:30 – 30:00",title:"ثلاث دگات",cap:"سكوت عشر ثواني. بعدها: دگ، دگ، دگ على الجامة. خلف واگف برّا، بإيده استكان چاي يبخّر، وكمّه مبلول لحد الكوع. \"چنت تصيّح أستاذ... طنطل.\"",note:"الضربة العالية الثانية، وآخر لقطة بالديمو."}
];
const root=document.getElementById('frames');
FR.forEach(f=>root.insertAdjacentHTML('beforeend',`<figure><canvas id="c-${f.id}" width="1280" height="720" role="img" aria-label="${f.title}"></canvas><figcaption><span class="t">FRAME ${f.n} · ${f.t}</span><h2>${f.title}</h2><p>${f.cap}</p><p class="note">${f.note}</p></figcaption></figure>`));

/* ---------- helpers ---------- */
let seed=7;const R=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
const W=1280,H=720;
function ctx(id){return document.getElementById('c-'+id).getContext('2d')}
function grad(c,y0,y1,stops){const g=c.createLinearGradient(0,y0,0,y1);stops.forEach(([o,col])=>g.addColorStop(o,col));return g}
function fog(c,y,h,a){for(let i=0;i<40;i++){const x=R()*W,yy=y+R()*h,r=120+R()*260;const g=c.createRadialGradient(x,yy,0,x,yy,r);g.addColorStop(0,`rgba(214,224,214,${a*(0.4+R()*0.6)})`);g.addColorStop(1,'rgba(214,224,214,0)');c.fillStyle=g;c.fillRect(x-r,yy-r,r*2,r*2)}}
function grain(c,a){const im=c.getImageData(0,0,W,H),d=im.data;for(let i=0;i<d.length;i+=4){const n=(R()-.5)*a;d[i]+=n;d[i+1]+=n;d[i+2]+=n}c.putImageData(im,0,0)}
function vignette(c,s){const g=c.createRadialGradient(W/2,H/2,H*.25,W/2,H/2,W*.75);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(0,0,0,${s})`);c.fillStyle=g;c.fillRect(0,0,W,H)}
function reeds(c,base,n,hmin,hmax,col,lw){c.strokeStyle=col;for(let i=0;i<n;i++){const x=R()*W,h=hmin+R()*(hmax-hmin),l=(R()-.5)*.35;c.lineWidth=lw*(0.6+R());c.beginPath();c.moveTo(x,base+R()*12);c.quadraticCurveTo(x+l*h*.5,base-h*.6,x+l*h,base-h);c.stroke()}}
function glow(c,x,y,r,col){const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=g;c.fillRect(x-r,y-r,r*2,r*2)}
function person(c,x,y,s,col){c.fillStyle=col;c.beginPath();c.arc(x,y-170*s,22*s,0,7);c.fill();c.beginPath();c.moveTo(x-38*s,y);c.quadraticCurveTo(x-46*s,y-110*s,x-26*s,y-145*s);c.lineTo(x+26*s,y-145*s);c.quadraticCurveTo(x+46*s,y-110*s,x+38*s,y);c.closePath();c.fill()}

/* ---------- 0. wake ---------- */
(function(){const c=ctx('wake');seed=5;
 c.fillStyle='#050706';c.fillRect(0,0,W,H);
 c.save();c.translate(W/2,H/2);c.rotate(-0.42);c.translate(-W/2,-H/2);
 // wall + door with neon light
 c.fillStyle='#141b17';c.fillRect(-300,-300,W+600,560);
 c.fillStyle='rgba(46,74,58,.55)';c.fillRect(-300,150,W+600,110);
 c.fillStyle='#0b0f0d';c.fillRect(760,-40,230,300);
 c.fillStyle='#000';c.fillRect(790,-20,170,280);
 c.fillStyle='rgba(205,245,225,.85)';c.beginPath();c.moveTo(790,-20);c.lineTo(840,-20);c.lineTo(840,260);c.lineTo(790,260);c.fill();
 glow(c,815,140,300,'rgba(170,230,200,.22)');
 c.fillStyle='#1d1612';c.beginPath();c.moveTo(840,-20);c.lineTo(960,10);c.lineTo(960,250);c.lineTo(840,260);c.fill();
 // floor plane (wet concrete), close to camera
 c.fillStyle=grad(c,260,H+400,[[0,'#151a17'],[1,'#070908']]);c.fillRect(-300,260,W+600,900);
 // light spill from door onto floor
 c.fillStyle='rgba(170,230,200,.10)';c.beginPath();c.moveTo(790,260);c.lineTo(840,260);c.lineTo(1100,900);c.lineTo(500,900);c.fill();
 // puddles reflecting bulb
 c.fillStyle='rgba(60,90,80,.35)';c.beginPath();c.ellipse(420,420,260,40,0,0,7);c.fill();
 glow(c,430,418,70,'rgba(255,230,170,.35)');
 // bulb (hanging)
 c.strokeStyle='#050605';c.lineWidth=2;c.beginPath();c.moveTo(430,-300);c.lineTo(430,10);c.stroke();
 glow(c,430,22,180,'rgba(255,225,160,.45)');c.fillStyle='rgba(255,236,190,1)';c.beginPath();c.arc(430,22,11,0,7);c.fill();
 // watch on floor
 c.fillStyle='#0d0f0e';c.beginPath();c.ellipse(560,560,60,22,0,0,7);c.fill();
 c.fillStyle='#cfc9b7';c.beginPath();c.ellipse(560,552,36,13,0,0,7);c.fill();
 c.strokeStyle='#111';c.lineWidth=2;c.beginPath();c.moveTo(560,552);c.lineTo(572,546);c.stroke();c.beginPath();c.moveTo(560,552);c.lineTo(548,556);c.stroke();
 // small recorder, spools
 c.fillStyle='#232825';c.fillRect(260,520,150,60);c.fillStyle='#121513';c.fillRect(276,532,48,30);c.fillRect(342,532,48,30);
 c.strokeStyle='#8f9a8a';c.lineWidth=2;[300,366].forEach(x=>{c.beginPath();c.arc(x,547,10,0,7);c.stroke()});
 glow(c,398,528,16,'rgba(255,40,20,.95)');
 // Ali's hand on the floor (foreground)
 c.fillStyle='#0a0b0a';c.beginPath();c.moveTo(-100,760);c.quadraticCurveTo(150,640,330,660);c.quadraticCurveTo(380,668,372,690);c.quadraticCurveTo(250,720,-100,900);c.fill();
 c.restore();
 // eyelids / blur edges
 const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'rgba(0,0,0,.95)');g.addColorStop(.18,'rgba(0,0,0,0)');g.addColorStop(.82,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.95)');c.fillStyle=g;c.fillRect(0,0,W,H);
 vignette(c,.9);grain(c,20);
})();

/* ---------- 1. bridge ---------- */
(function(){const c=ctx('bridge');seed=11;
 c.fillStyle=grad(c,0,H,[[0,'#05080a'],[.55,'#121b1d'],[.56,'#0a1012'],[1,'#020304']]);c.fillRect(0,0,W,H);
 const hz=396;
 // broken bridge
 c.fillStyle='#030505';
 c.beginPath();c.moveTo(0,250);c.lineTo(470,262);c.lineTo(560,330);c.lineTo(540,340);c.lineTo(450,280);c.lineTo(0,276);c.fill();
 c.beginPath();c.moveTo(W,240);c.lineTo(860,256);c.lineTo(760,350);c.lineTo(782,356);c.lineTo(880,276);c.lineTo(W,268);c.fill();
 [120,300,1000,1180].forEach(x=>{c.fillRect(x-12,262,24,hz-262)});
 c.strokeStyle='#030505';c.lineWidth=3;for(let i=0;i<7;i++){c.beginPath();c.moveTo(540+i*6,334);c.lineTo(560+i*10,390+R()*20);c.stroke()}
 // reflection: intact bridge
 c.save();c.globalAlpha=.42;c.fillStyle='#0d1a1c';c.fillRect(0,hz+108,W,22);[120,300,640,1000,1180].forEach(x=>c.fillRect(x-12,hz,24,108));
 [[380,'#d9b45a'],[420,'#d9b45a']].forEach(([x,col])=>glow(c,x,hz+116,40,'rgba(230,190,100,.9)'));c.restore();
 c.strokeStyle='rgba(180,200,200,.07)';for(let i=0;i<40;i++){const y=hz+8+i*i*.25;c.lineWidth=1;c.beginPath();c.moveTo(0,y+R()*3);c.lineTo(W,y+R()*3);c.stroke()}
 // pontoon & car hood
 c.fillStyle='#0c1110';c.beginPath();c.moveTo(0,H);c.lineTo(380,470);c.lineTo(900,470);c.lineTo(W,H);c.fill();
 c.strokeStyle='#1b2321';c.lineWidth=2;for(let i=0;i<9;i++){const t=i/8;c.beginPath();c.moveTo(380+(0-380)*t*0+ (0+380*(1-t))*0 + 380*(1-t),470+ (H-470)*t);c.lineTo(900+ (W-900)*t,470+(H-470)*t);c.stroke()}
 fog(c,240,220,.10);
 c.fillStyle='#020303';c.beginPath();c.moveTo(0,H);c.lineTo(0,610);c.quadraticCurveTo(W/2,560,W,610);c.lineTo(W,H);c.fill();
 c.fillStyle='rgba(194,69,28,.85)';c.fillRect(W/2-30,640,8,4);
 vignette(c,.85);grain(c,18);
})();

/* ---------- 2. car ---------- */
(function(){const c=ctx('car');seed=23;
 c.fillStyle=grad(c,0,H,[[0,'#0a0f0e'],[.5,'#1a2220'],[1,'#0b0e0d']]);c.fillRect(0,0,W,H);
 fog(c,150,300,.14);
 // road
 c.fillStyle='#141917';c.beginPath();c.moveTo(380,420);c.lineTo(900,420);c.lineTo(W,H);c.lineTo(0,H);c.fill();
 // broken car
 c.fillStyle='#070908';c.beginPath();c.moveTo(560,410);c.lineTo(580,360);c.lineTo(700,355);c.lineTo(730,400);c.lineTo(745,412);c.lineTo(560,418);c.fill();
 glow(c,575,402,70,'rgba(255,150,40,.85)');glow(c,735,402,70,'rgba(255,150,40,.85)');
 // tall shape (tantal) behind
 c.fillStyle='rgba(0,0,0,.92)';c.beginPath();c.moveTo(780,410);c.quadraticCurveTo(790,200,800,120);c.quadraticCurveTo(815,200,826,410);c.fill();
 // sign
 c.fillStyle='#2a2c27';c.fillRect(420,300,6,120);c.fillStyle='#4a4b42';c.fillRect(380,282,140,46);
 c.fillStyle='#d8d4c4';c.font='22px "IBM Plex Sans Arabic"';c.textAlign='center';c.fillText('أم الشويچ',450,312);
 c.strokeStyle='#b23a17';c.lineWidth=4;c.beginPath();c.moveTo(392,306);c.lineTo(508,304);c.stroke();
 c.fillStyle='#c2451c';c.font='20px "Reem Kufi"';c.fillText('مكتوم',450,354);
 reeds(c,430,120,40,140,'rgba(5,7,6,.9)',1.4);
 // windshield frame + dash
 c.fillStyle='#020303';c.beginPath();c.moveTo(0,0);c.lineTo(W,0);c.lineTo(W,90);c.quadraticCurveTo(W/2,40,0,90);c.fill();
 c.beginPath();c.moveTo(0,0);c.lineTo(110,0);c.lineTo(220,560);c.lineTo(0,600);c.fill();
 c.beginPath();c.moveTo(W,0);c.lineTo(W-110,0);c.lineTo(W-220,560);c.lineTo(W,600);c.fill();
 c.fillStyle='#050706';c.beginPath();c.moveTo(0,H);c.lineTo(0,560);c.quadraticCurveTo(W/2,520,W,560);c.lineTo(W,H);c.fill();
 // cassette deck
 c.fillStyle='#111614';c.fillRect(560,600,160,46);c.fillStyle='#1c2421';c.fillRect(580,612,120,22);
 glow(c,708,616,14,'rgba(255,40,20,1)');c.fillStyle='#ff3a1a';c.beginPath();c.arc(708,616,3,0,7);c.fill();
 // rain drops
 c.fillStyle='rgba(200,215,210,.10)';for(let i=0;i<140;i++){const x=120+R()*(W-240),y=90+R()*450;c.beginPath();c.ellipse(x,y,2+R()*3,3+R()*5,0,0,7);c.fill()}
 vignette(c,.8);grain(c,16);
})();

/* ---------- 3. levee with echo pulse ---------- */
(function(){const c=ctx('levee');seed=37;
 c.fillStyle=grad(c,0,H,[[0,'#040606'],[.5,'#0a0f0d'],[1,'#030404']]);c.fillRect(0,0,W,H);
 const hz=350;
 // cracked ground
 c.fillStyle='#0d110f';c.beginPath();c.moveTo(0,hz);c.lineTo(W,hz);c.lineTo(W,H);c.lineTo(0,H);c.fill();
 c.strokeStyle='rgba(0,0,0,.8)';c.lineWidth=1.5;for(let i=0;i<160;i++){const x=R()*W,y=hz+R()*(H-hz);c.beginPath();c.moveTo(x,y);for(let k=0;k<3;k++)c.lineTo(x+(R()-.5)*90,y+(R()-.5)*40);c.stroke()}
 // reed bundles as people rows
 const bundles=[];for(let row=0;row<3;row++){for(let i=0;i<9;i++){const s=.55+row*.22,x=80+i*140+row*40+(R()-.5)*30,y=hz+30+row*95;bundles.push([x,y,s])}}
 bundles.forEach(([x,y,s])=>{c.fillStyle='#030404';c.beginPath();c.moveTo(x-26*s,y);c.lineTo(x-18*s,y-150*s);c.quadraticCurveTo(x,y-195*s,x+18*s,y-150*s);c.lineTo(x+26*s,y);c.fill()});
 // echo pulse rings
 const cx=W/2,cy=H+40;
 for(let k=0;k<4;k++){c.strokeStyle=`rgba(111,214,160,${.55-k*.12})`;c.lineWidth=2;c.beginPath();c.ellipse(cx,cy,420+k*140,(420+k*140)*.42,0,Math.PI,2*Math.PI);c.stroke()}
 // outlines on bundles in green
 c.strokeStyle='rgba(111,214,160,.75)';c.lineWidth=1.6;
 bundles.forEach(([x,y,s],i)=>{const tilt=(i===13)?.35:0;c.save();c.translate(x,y);c.beginPath();c.moveTo(-26*s,0);c.lineTo(-18*s,-150*s);c.save();c.rotate(tilt);c.quadraticCurveTo(0,-195*s,18*s,-150*s);c.restore();c.lineTo(26*s,0);c.stroke();c.restore()});
 // the tilted one: a head
 const [tx,ty,ts]=bundles[13];c.strokeStyle='rgba(226,232,223,.9)';c.lineWidth=2.2;c.beginPath();c.arc(tx+16*ts,ty-178*ts,18*ts,0,7);c.stroke();
 fog(c,180,260,.07);vignette(c,.9);grain(c,14);
})();

/* ---------- 4. corridor ---------- */
function corridorBase(c,neon){
 const vx=W/2+40,vy=330;
 c.fillStyle='#0b100e';c.fillRect(0,0,W,H);
 // walls
 const wall='#1e2a24';c.fillStyle=wall;
 c.beginPath();c.moveTo(0,0);c.lineTo(vx-90,vy-80);c.lineTo(vx-90,vy+70);c.lineTo(0,H);c.fill();
 c.fillStyle='#18221d';c.beginPath();c.moveTo(W,0);c.lineTo(vx+90,vy-80);c.lineTo(vx+90,vy+70);c.lineTo(W,H);c.fill();
 c.fillStyle='#101613';c.beginPath();c.moveTo(0,0);c.lineTo(W,0);c.lineTo(vx+90,vy-80);c.lineTo(vx-90,vy-80);c.fill();
 c.fillStyle='#0d1210';c.beginPath();c.moveTo(0,H);c.lineTo(W,H);c.lineTo(vx+90,vy+70);c.lineTo(vx-90,vy+70);c.fill();
 // lower wall paint band (government green)
 c.fillStyle='rgba(46,74,58,.6)';c.beginPath();c.moveTo(0,330);c.lineTo(vx-90,vy+5);c.lineTo(vx-90,vy+70);c.lineTo(0,H);c.fill();
